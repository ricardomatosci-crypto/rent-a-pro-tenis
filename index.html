    await sb.from('professores').upsert({
      email: S.u.e.toLowerCase(),
      nome: S.u.n,
      telefone: S.u.t || '',
      cep: S.u.p || '',

      historico: S.ptLog.slice(0,50),
      lgpd_aceite: true,
      atualizado_em: new Date().toISOString()
    }, { onConflict: 'email' });
  }catch(e){}
}

async function carregarPerfilDB(email){
  if(!sb || !email) return;
  try{
    const { data } = await sb.from('professores').select('*').eq('email', email.toLowerCase()).maybeSingle();

      S.u = {
        n: data.nome || S.u?.n || '',

      };

/* ---------- Chamada Segura à API do Gemini via Vercel (/api/gemini) ---------- */
async function askGemini(promptText, useSearch=false){
  const res = await fetch('/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ prompt: promptText, useSearch })
  });
  const data = await res.json();
  if(!res.ok){
    throw new Error(data.error || 'Erro ao conectar com a IA.');
  }
  return data.result;
}

  S.nt.unshift({t,d:new Date().toLocaleDateString('pt-BR'),r:0});
  S.nt=S.nt.slice(0,25);
}

function gainPts(pontos, motivo){
  const d=new Date();
  const dt=d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  S.ptLog.unshift({p:pontos,m:motivo,d:dt});
  S.ptLog=S.ptLog.slice(0,100);
  addN(`+${pontos} pts: ${motivo}`);
  save();
  hdr();
  syncPerfilDB();
}

}

async function loginGoogle(){
  const m=$('cm');
  if(!sb){
    m.textContent='Erro ao carregar conexão com o banco.';
    return;
  }
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin }
  });
  if(error) m.textContent='Erro ao iniciar login com Google: '+error.message;
}

async function saveCad(){
  const g=i=>$(i).value.trim(),d=i=>g(i).replace(/\D/g,''),m=$('cm'),btn=$('cadb');
  const u={n:g('cn'),e:g('ce'),t:d('ct'),p:d('cp')};
  const err=u.n.split(/\s+/).length<2?'Informe seu nome completo.':!/^\S+@\S+\.\S+$/.test(u.e)?'E-mail inválido.':(u.t && (u.t.length<10||u.t.length>11))?'Telefone inválido (use o DDD).':(u.p && u.p.length!==8)?'CEP inválido (8 números).':!$('ck').checked?'É preciso concordar com o termo LGPD.':'';
  if(err){m.textContent=err;return}
  btn.disabled=true;btn.textContent='Salvando...';
  S.u=u;save();
  await syncPerfilDB();
  tab='home';render();
}

async function sairConta(){
  if(!confirm('Deseja sair da sua conta neste aparelho?'))return;
  if(sb) try{await sb.auth.signOut()}catch(e){}
  S.u=null;save();render();
}

    <div class="mut" id="hmsg" style="margin-top:6px"></div>
  </div><div id="hres">${resH()}</div>`;

  const painelAudio=`<div class="card">

    <textarea id="rel" style="min-height:130px" placeholder="Sua fala aparece aqui automaticamente. Você também pode digitar ou editar o texto..." oninput="rel=this.value">${esc(rel)}</textarea>

async function gerarH(){
  const btn=$('hb'),msg=$('hmsg'),mat=$('hm').value.trim();
  if(!mat){$('hm').focus();msg.textContent='Informe os materiais disponíveis.';return}
  let sw='nenhum';
  if(hk){const q=hk.split('-').map(Number),m=ANO.find(x=>x.n===q[0]);if(m)sw=m.t+': '+m.f}
  const fmt=JSON.stringify({q:[{n:'nome da atividade',m:[{x:110,y:300,t:'aluno'}]}],n:'título curto da aula',c:'conteúdo da aula',o:'observação',mt:'materiais usados',b:[{t:'título do bloco',m:5,x:'descrição'}]});
  const prompt='Você ajuda um professor de tênis do projeto Rent a Pro a montar planos de aula. Monte um plano de 50 minutos em português do Brasil.\n'+
  'Número de alunos: '+($('hn').value||'não informado')+'\nIdade/Nível: '+($('hi').value.trim()||'não informada')+'\nMateriais disponíveis: '+mat+'\nObjetivo mensal: '+sw+'\nPedido extra: '+($('hx').value.trim()||'nenhum')+'\n'+
  'Em q, desenhe a quadra de 1 a 3 atividades da parte principal e final: coordenadas x de 20 a 200 e y de 25 a 415 (rede em y=220), t igual a aluno, prof, cone ou alvo, de 6 a 20 marcadores por desenho.\n'+
  'Regras: use somente os materiais disponíveis; adapte estações e rodízios ao número de alunos; blocos na ordem roda inicial 5 min, aquecimento 10, parte principal 15, parte final 15, feedback e volta à calma 5 (total 50); aula dinâmica, sem filas grandes.\n'+
  (gen?'Gere uma versão diferente da anterior, sem repetir: '+JSON.stringify(gen.b.map(x=>x.t))+'\n':'')+
  'Exemplos de estilo: '+JSON.stringify(exPlans())+'\nResponda somente com JSON neste formato: '+fmt;
  btn.disabled=true;btn.textContent='Gerando plano...';msg.textContent='';
  let r;
  try{r=await askGemini(prompt)}
  catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='Gerar plano de aula (+15 pts)';return}
  if(!r||!Array.isArray(r.b)||!r.b.length){msg.textContent='Resposta incompleta. Tente de novo.';btn.disabled=false;btn.textContent='Gerar plano de aula (+15 pts)';return}
  gen={n:String(r.n||''),c:String(r.c||''),o:String(r.o||''),mt:String(r.mt||mat),b:r.b.map(x=>({t:String(x.t||''),m:+x.m||0,x:String(x.x||'')})),qd:qdOf(r.q)};
  gainPts(15,'Gerou plano de aula com IA');
  vHome();
}

function saveH(){
  S.treinos.unshift({titulo:gen.n||'Treino gerado',d:new Date().toLocaleDateString('pt-BR'),aluno:(S.al?S.al+' alunos':'')+(S.al&&S.id?', ':'')+(S.id||''),min:String(tot(gen)),texto:gen.b.map(x=>x.t+' ('+x.m+' min): '+x.x).join('\n')});
  save();vHome();
}
function saveW(){
  S.sp[hk]={c:gen.c,o:gen.o,mt:gen.mt,b:JSON.parse(JSON.stringify(gen.b))};save();abrirA(hk);
}

/* Gravação de Áudio e Relato */
function setRec(v){rec=v;const b=$('rmic');if(b)b.textContent=v?'⏹ Parar gravação':'🎙️ Gravar áudio da aula'}
function addTxt(t){rel=(rel?rel+' ':'')+String(t).trim();if($('rel'))$('rel').value=rel}
function showTxt(p){if($('rel'))$('rel').value=rel+(p?(rel?' ':'')+p:'')}
function micToggle(){
  const msg=$('rmsg');msg.textContent='';
  if(rec){if(sr)sr.stop();return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){msg.textContent='Gravação direta indisponível neste navegador. Toque no campo de texto e use o microfone do teclado do celular.';return}
  sr=new SR();sr.lang='pt-BR';sr.continuous=true;sr.interimResults=true;
  sr.onstart=()=>setRec(true);sr.onend=()=>{setRec(false);showTxt('')};
  sr.onerror=e=>{msg.textContent='Não consegui acessar o microfone ('+(e.error||'erro')+'). Use o microfone do teclado do celular.'};
  sr.onresult=e=>{let f='',p='';for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)f+=t+' ';else p+=t}if(f)addTxt(f);showTxt(p)};
  try{sr.start()}catch(e){}
}
async function relatoIA(){
  const msg=$('rmsg'),btn=$('rgb');rel=$('rel').value.trim();
  if(rel.length<15){msg.textContent='Grave ou escreva o relato da aula primeiro.';return}
  const fmt=JSON.stringify({n:'título curto da aula',c:'conteúdo da aula',o:'observação',mt:'materiais usados',b:[{t:'título do bloco',m:5,x:'descrição'}]});
  const prompt='Você ajuda um professor de tênis. Abaixo está o relato falado de uma aula que ele JÁ DEU. Transforme em um plano de aula organizado, em português do Brasil. Seja fiel ao relato: não invente atividades não mencionadas; corrija erros de transcrição; organize em blocos na ordem em que aconteceram.\n'+
  'Turma: '+(S.al?S.al+' alunos':'não informada')+', '+(S.id||'')+'\nRelato: '+rel+'\nResponda somente com JSON neste formato: '+fmt;
  btn.disabled=true;btn.textContent='Organizando relato...';msg.textContent='';
  let r;
  try{r=await askGemini(prompt)}
  catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='Transformar relato em plano (+15 pts)';return}
  if(!r||!Array.isArray(r.b)||!r.b.length){msg.textContent='Resposta incompleta. Tente de novo.';btn.disabled=false;btn.textContent='Transformar relato em plano (+15 pts)';return}
  ger2={n:String(r.n||''),c:String(r.c||''),o:String(r.o||''),mt:String(r.mt||''),b:r.b.map(x=>({t:String(x.t||''),m:+x.m||0,x:String(x.x||'')}))};
  gainPts(15,'Transformou relato de áudio em plano');
  vHome();
}
function saveR(){
  S.treinos.unshift({titulo:ger2.n||'Aula registrada',d:new Date().toLocaleDateString('pt-BR'),aluno:(S.al?S.al+' alunos':'')+(S.al&&S.id?', ':'')+(S.id||''),min:String(tot(ger2)),texto:ger2.b.map(x=>x.t+' ('+x.m+' min): '+x.x).join('\n')});
  ger2=null;rel='';save();vHome();
}
function delT(i){if(confirm('Excluir esta aula salva?')){S.treinos.splice(i,1);save();vHome()}}

/* ---------- Aba Quadra ---------- */
function courtSvg(){
  let n=0;
  const m=cur.map(p=>{
    if(p.t==='aluno'){n++;return `<g><circle cx="${p.x}" cy="${p.y}" r="11" fill="#22c55e" stroke="#fff" stroke-width="2"/><text x="${p.x}" y="${p.y+4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">${n}</text></g>`}
    if(p.t==='prof')return `<g><circle cx="${p.x}" cy="${p.y}" r="11" fill="#0B192C" stroke="#A3E635" stroke-width="2"/><text x="${p.x}" y="${p.y+4.5}" text-anchor="middle" font-size="13" font-weight="700" fill="#A3E635">P</text></g>`;
    if(p.t==='cone')return `<polygon points="${p.x},${p.y-10} ${p.x+9},${p.y+8} ${p.x-9},${p.y+8}" fill="#f59e0b" stroke="#fff" stroke-width="1.5"/>`;
    return `<g><circle cx="${p.x}" cy="${p.y}" r="10" fill="none" stroke="#ef4444" stroke-width="3"/><circle cx="${p.x}" cy="${p.y}" r="3" fill="#ef4444"/></g>`}).join('');
  return `<svg id="court" viewBox="0 0 220 440" xmlns="http://www.w3.org/2000/svg"><rect width="220" height="440" fill="var(--court)"/>
  <g stroke="var(--ln)" stroke-width="2" fill="none"><rect x="20" y="25" width="180" height="390"/><line x1="42.5" y1="25" x2="42.5" y2="415"/><line x1="177.5" y1="25" x2="177.5" y2="415"/>
  <line x1="42.5" y1="115" x2="177.5" y2="115"/><line x1="42.5" y1="325" x2="177.5" y2="325"/><line x1="110" y1="115" x2="110" y2="325"/></g>
  <line x1="12" y1="220" x2="208" y2="220" stroke="#A3E635" stroke-width="4" stroke-dasharray="5 3"/>${m}</svg>`;
}
function vQuadra(){
  const salvas=S.quadras.length?S.quadras.map((q,i)=>`<div class="card"><b>${esc(q.nome)}</b> <span class="mut">${q.m.length} itens</span>
  <div class="acts"><button class="sm" onclick="abrirQ(${i})">Abrir</button><button class="sm del" onclick="delQ(${i})">Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma disposição salva. Monte uma na quadra acima.</div>';
  $('app').innerHTML=`<h2>Disposição na quadra</h2><div class="mut">Escolha o item e toque na quadra para posicionar.</div>
  <div class="modes">${MODOS.map(x=>`<button class="${x[0]===modo?'on':''}" onclick="setModo('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="cur=[];vQuadra()">Limpar</button></div>
  <div id="cw">${courtSvg()}</div>
  <div class="card"><input id="qn" placeholder="Nome da disposição (ex.: Cross de backhand)"><button class="btn" onclick="saveQ()">Salvar disposição (+10 pts)</button></div>
  <h2>Disposições salvas</h2>${salvas}`;
  bindCourt();
}
function bindCourt(){
  const s=$('court');
  s.onclick=e=>{
    const pt=s.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;
    const p=pt.matrixTransform(s.getScreenCTM().inverse());
    const x=Math.round(p.x),y=Math.round(p.y);
    if(modo==='del'){
      let b=-1,d=18;cur.forEach((q,i)=>{const k=Math.hypot(q.x-x,q.y-y);if(k<d){d=k;b=i}});
      if(b>=0)cur.splice(b,1);
    }else cur.push({x,y,t:modo});
    $('cw').innerHTML=courtSvg();bindCourt();
  };
}
function setModo(m){modo=m;vQuadra()}
function saveQ(){
  const nome=$('qn').value.trim();if(!nome){$('qn').focus();return}
  if(!cur.length){alert('Posicione pelo menos um item na quadra antes de salvar.');return}
  S.quadras.push({nome,m:JSON.parse(JSON.stringify(cur))});
  gainPts(10,`Criou diagrama de quadra "${nome}"`);
  vQuadra();
}
function abrirQ(i){cur=JSON.parse(JSON.stringify(S.quadras[i].m));tab='quadra';render()}
function delQ(i){if(confirm('Excluir esta disposição?')){S.quadras.splice(i,1);save();vQuadra()}}

let sem=new Date().getMonth()>=7?2:1;

function vPlano(){
  const mes=new Date().getMonth()+1;
  const ms=ANO.filter(m=>sem===1?m.n<=6:m.n>=8);
  $('app').innerHTML=`<h2>Planejamento anual</h2>
  <div class="mut">Objetivos gerais de cada mês para orientar o planejamento livre de cada professor.</div>
  <div class="modes"><button class="${sem===1?'on':''}" onclick="sem=1;vPlano()">1º semestre</button><button class="${sem===2?'on':''}" onclick="sem=2;vPlano()">2º semestre</button></div>`+
  ms.map(m=>{
    const k=m.n+'-0';
    return `<div class="card" style="${m.n===mes?'border-color:var(--ball);border-width:2px':''}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b>${m.t}</b>
        ${m.n===mes?'<span class="pt-badge">Mês atual</span>':''}
      </div>
      <div class="pre">${esc(m.f)}</div>
      ${hasP(k)?'<div class="mut">Plano personalizado salvo ('+mins(k)+' min)</div>':''}

const hasP=k=>{const p=S.sp[k]||SEED[k];return p&&p.c};
let ek='';
const P=()=>getP(ek);
function abrirA(k){ek=k;tab='aula';render()}
function vAula(){
  const p=getP(ek),q=ek.split('-').map(Number),m=ANO.find(x=>x.n===q[0]);

  p.b.map((x,i)=>`<div class="card"><div class="row"><input value="${esc(x.t)}" oninput="P().b[${i}].t=this.value;save()"><input type="number" inputmode="numeric" style="max-width:90px" value="${esc(x.m)}" oninput="P().b[${i}].m=this.value;save();$('tt').textContent=tot(P())"></div><textarea oninput="P().b[${i}].x=this.value;save()">${esc(x.x)}</textarea><button class="sm del" onclick="delB(${i})">Remover bloco</button></div>`).join('')+

/* ---------- Aba Vídeos ---------- */
let vw='';
const eq=s=>encodeURIComponent(s);
const slug=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const lk=(u,n)=>`<a class="sm" style="text-decoration:none" href="${u}" target="_blank" rel="noopener">${n}</a>`;
const sugHtml=s=>`<div class="card"><b>${esc(s.t)}</b><div class="pre">${esc(s.p)}</div><div class="mut">Busca: ${esc(s.q)}</div><div class="acts">${lk('https://www.youtube.com/results?search_query='+eq(s.q),'YouTube')}${lk('https://www.tiktok.com/search?q='+eq(s.q),'TikTok')}${lk('https://www.instagram.com/explore/tags/'+slug(s.h||s.q)+'/','Instagram')}</div></div>`;

function vVideos(){
  if(!vw)vw=String(new Date().getMonth()+1);
  if(!ANO.find(x=>String(x.n)===vw))vw='2';
  const opts=ANO.map(m=>`<option value="${m.n}" ${String(m.n)===vw?'selected':''}>${m.t} — ${esc(m.f)}</option>`).join('');
  const m=ANO.find(x=>String(x.n)===vw),lst=S.vs&&S.vs[vw];
  $('app').innerHTML=`<h2>Sugestões de vídeos</h2><div class="mut">Ideias de exercícios e educativos alinhados ao objetivo geral do mês.</div><div class="card"><select onchange="vw=this.value;vVideos()">${opts}</select><div style="margin-top:6px"><b>Objetivo de ${esc(m.t)}:</b></div><div class="pre">${esc(m.f)}</div><button class="btn" id="vbt" onclick="sugerirV()">${lst?'Gerar novas sugestões (+10 pts)':'Sugerir vídeos do mês (+10 pts)'}</button><div class="mut" id="vmsg" style="margin-top:6px"></div></div>`+(lst?lst.map(sugHtml).join(''):'<div class="empty">Toque no botão acima para buscar ideias de vídeos.</div>');
}
async function sugerirV(){
  const btn=$('vbt'),msg=$('vmsg');
  const m=ANO.find(x=>String(x.n)===vw);
  const fmt=JSON.stringify([{t:'tema do vídeo',p:'por que ajuda neste mês',q:'busca em português',h:'hashtag'}]);
  const prompt='Você ajuda um professor de tênis. Sugira 5 ideias de vídeos de tênis ligadas ao objetivo mensal. Não invente títulos ou links falsos. Para cada ideia dê o tema, por que ajuda e uma busca curta em português (3 a 6 palavras) para YouTube/TikTok, além de uma hashtag sem acento em h.\nMês: '+m.t+'\nObjetivo geral: '+m.f+'\nResponda somente com um array JSON neste formato: '+fmt;
  btn.disabled=true;btn.textContent='Buscando ideias...';msg.textContent='';
  let r;
  try{r=await askGemini(prompt)}
  catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='Sugerir vídeos do mês (+10 pts)';return}
  if(!Array.isArray(r)||!r.length){msg.textContent='Resposta incompleta. Tente de novo.';btn.disabled=false;btn.textContent='Sugerir vídeos do mês (+10 pts)';return}
  S.vs=S.vs||{};S.vs[vw]=r.slice(0,5).map(x=>({t:String(x.t||''),p:String(x.p||''),q:String(x.q||x.t||''),h:String(x.h||'')}));
  gainPts(10,`Buscou referências de vídeos para ${m.t}`);
  vVideos();
}

/* ---------- Aba News (Notícias de Tênis em Tempo Real) ---------- */
function vNews(){
  const lista=S.news.length
    ? S.news.map(n=>`<div class="card">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <b>${esc(n.titulo)}</b>
          ${n.fonte?`<span class="chip">${esc(n.fonte)}</span>`:''}
        </div>
        <div class="pre">${esc(n.resumo)}</div>
        ${n.url?`<div class="acts"><a class="sm" style="text-decoration:none" href="${esc(n.url)}" target="_blank" rel="noopener">Ler matéria completa ↗</a></div>`:''}
      </div>`).join('')
    : '<div class="empty">Nenhuma notícia carregada ainda. Toque no botão acima para rastrear as últimas novidades do tênis!</div>';

  $('app').innerHTML=`<h2>Tênis News</h2>
  <div class="mut">Principais notícias do tênis mundial e brasileiro, torneios ATP/WTA e tênis juvenil com resumo e link direto.</div>
  <div class="card">
    <button class="btn" id="nbt" onclick="buscarNews()">🔄 Atualizar notícias de tênis (+10 pts)</button>
    <div class="mut" id="nmsg" style="margin-top:6px">${S.newsAt?'Última atualização: '+esc(S.newsAt):''}</div>
  </div>
  ${lista}`;
}

async function buscarNews(){
  const btn=$('nbt'),msg=$('nmsg');
  const fmt=JSON.stringify([{titulo:'Manchete da notícia',fonte:'Nome do portal',resumo:'Resumo objetivo em 2 a 3 linhas',url:'https://link-real-da-materia'}]);
  const prompt='Busque na web as 6 notícias mais recentes e relevantes sobre tênis (ATP, WTA, Grand Slams, João Fonseca, Bia Haddad, tênis brasileiro e mundial). Para cada notícia, entregue a manchete em português, o nome do portal/fonte, um resumo claro de 2 a 3 linhas e a URL real da matéria encontrada na busca. Responda somente com um array JSON neste formato: '+fmt;
  btn.disabled=true;btn.textContent='Rastreando notícias...';msg.textContent='';
  let r;
  try{r=await askGemini(prompt, true)}
  catch(e){msg.textContent=e.message;btn.disabled=false;btn.textContent='🔄 Atualizar notícias de tênis (+10 pts)';return}
  if(!Array.isArray(r)||!r.length){msg.textContent='Não foi possível carregar notícias agora. Tente novamente.';btn.disabled=false;btn.textContent='🔄 Atualizar notícias de tênis (+10 pts)';return}
  S.news=r.slice(0,6).map(x=>({
    titulo:String(x.titulo||''),
    fonte:String(x.fonte||''),
    resumo:String(x.resumo||''),
    url:String(x.url||'').startsWith('http')?String(x.url):''
  })).filter(x=>x.titulo);
  const d=new Date();
  S.newsAt=d.toLocaleDateString('pt-BR')+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  gainPts(10,'Atualizou o feed Tênis News');
  vNews();
}

/* ---------- Inicialização + Escuta do Login Google ---------- */
if(sb){
  sb.auth.onAuthStateChange(async (event, session) => {
    if(session && session.user){
      const meta = session.user.user_metadata || {};
      const email = session.user.email;
      if(!S.u || S.u.e !== email){
        S.u = {
          n: meta.full_name || meta.name || email.split('@')[0],
          e: email,
          t: S.u?.t || '',
          p: S.u?.p || '',
          google: true
        };
        save();
        await carregarPerfilDB(email);
        await syncPerfilDB();
        render();
      }
    }
  });
}

render();
</script>
